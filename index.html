<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dulce Detalle | Mini Queques Artesanales</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1 class="logo">🧁 Dulce Detalle</h1>
  <button class="btn-carrito" onclick="toggleCarrito()">🛒 Carrito</button>
</header>

<section class="hero">
  <h2>Mini queques artesanales<br>hechos con amor</h2>
  <p>Calidad gourmet para tus momentos especiales</p>
</section>

<section class="catalogo">
  <h2 class="titulo-seccion">Nuestros Productos</h2>

  <div class="productos-grid">

    <div class="producto-card">
      <img src="img/01.png" alt="Mini Queque Chocolate">
      <h3>Mini Queque Chocolate</h3>
      <p class="precio">S/. 6.00</p>
      <input type="number" min="1" value="1" id="cant-choco">
      <button onclick="agregarProductoDesdeUI('Mini Queque Chocolate', 6, 'cant-choco')">
        Agregar
      </button>
    </div>

    <div class="producto-card">
      <img src="img/02.png" alt="Mini Queque Vainilla">
      <h3>Mini Queque Vainilla</h3>
      <p class="precio">S/. 5.50</p>
      <input type="number" min="1" value="1" id="cant-vainilla">
      <button onclick="agregarProductoDesdeUI('Mini Queque Vainilla', 5.5, 'cant-vainilla')">
        Agregar
      </button>
    </div>

  </div>
</section>

<!-- CARRITO -->
<aside class="carrito" id="carrito">
  <h3>🛒 Tu pedido</h3>
  <ul id="listaCarrito"></ul>

  <p class="total">Total: S/. <span id="total">0.00</span></p>

  <button class="btn-whatsapp" onclick="enviarWhatsApp()">
    Confirmar por WhatsApp
  </button>
</aside>

<footer class="footer">
  <p>© 2026 Dulce Detalle · Pastelería Artesanal</p>
</footer>

<script src="script.js"></script>
</body>
</html>
